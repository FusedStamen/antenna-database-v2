  <ellipse cx="130" cy="320" rx="44" ry="110" fill="#f0880020" stroke="#f08800" stroke-width="0.8" stroke-dasharray="5 4"/>
  <ellipse cx="163" cy="315" rx="44" ry="108" fill="#f0880018" stroke="#f08800" stroke-width="0.8" stroke-dasharray="5 4"/>
  <ellipse cx="196" cy="314" rx="44" ry="108" fill="#f0880018" stroke="#f08800" stroke-width="0.8" stroke-dasharray="5 4"/>
  <ellipse cx="229" cy="314" rx="44" ry="108" fill="#f0880018" stroke="#f08800" stroke-width="0.8" stroke-dasharray="5 4"/>
  <ellipse cx="262" cy="315" rx="44" ry="108" fill="#f0880018" stroke="#f08800" stroke-width="0.8" stroke-dasharray="5 4"/>
  <ellipse cx="295" cy="318" rx="44" ry="110" fill="#f0880020" stroke="#f08800" stroke-width="0.8" stroke-dasharray="5 4"/>

