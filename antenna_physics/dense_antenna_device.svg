  <circle cx="130" cy="442" r="7" fill="#c8a020" stroke="#a07010" stroke-width="1"/>
  <circle cx="163" cy="442" r="7" fill="#c8a020" stroke="#a07010" stroke-width="1"/>
  <circle cx="196" cy="442" r="7" fill="#c8a020" stroke="#a07010" stroke-width="1"/>
  <circle cx="229" cy="442" r="7" fill="#c8a020" stroke="#a07010" stroke-width="1"/>
