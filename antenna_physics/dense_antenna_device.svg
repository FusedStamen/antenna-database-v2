<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <title>Dense wardriving node cluster — antenna spacing illustration</title>

  <!-- Background -->
  <rect width="800" height="600" fill="#1a1a1e"/>

  <!-- Desk/surface -->
  <rect x="0" y="480" width="800" height="120" fill="#2a2a2f"/>
  <rect x="0" y="478" width="800" height="3" fill="#3a3a40"/>

  <!-- USB cables coming out bottom -->
  <path d="M160 520 Q140 560 120 600" stroke="#222228" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M200 520 Q190 570 185 600" stroke="#222228" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M540 520 Q560 565 570 600" stroke="#222228" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M580 520 Q610 560 630 600" stroke="#222228" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- USB connector ends -->
  <rect x="112" y="590" width="16" height="10" rx="2" fill="#444"/>
  <rect x="177" y="590" width="16" height="10" rx="2" fill="#444"/>
  <rect x="562" y="590" width="16" height="10" rx="2" fill="#444"/>
