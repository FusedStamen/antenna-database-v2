  <circle cx="556" cy="480" r="3" fill="#c0c0c4"/>
  <circle cx="570" cy="480" r="3" fill="#c0c0c4"/>
  <circle cx="584" cy="480" r="3" fill="#c0c0c4"/>
  <circle cx="598" cy="480" r="3" fill="#c0c0c4"/>
  <circle cx="612" cy="480" r="3" fill="#c0c0c4"/>
  <circle cx="626" cy="480" r="3" fill="#c0c0c4"/>
  <circle cx="640" cy="480" r="3" fill="#c0c0c4"/>
  <circle cx="654" cy="480" r="3" fill="#c0c0c4"/>
