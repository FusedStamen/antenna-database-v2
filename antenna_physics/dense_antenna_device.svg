  <!-- ventilation dots -->
  <circle cx="120" cy="480" r="3" fill="#c0c0c4"/>
  <circle cx="134" cy="480" r="3" fill="#c0c0c4"/>
  <circle cx="148" cy="480" r="3" fill="#c0c0c4"/>
