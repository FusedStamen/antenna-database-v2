  <line x1="576" y1="435" x2="572" y2="193" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <rect x="568" y="189" width="8" height="4" rx="2" fill="#555"/>
  <line x1="609" y1="435" x2="609" y2="192" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <rect x="605" y="188" width="8" height="4" rx="2" fill="#555"/>
  <line x1="642" y1="435" x2="646" y2="194" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <rect x="642" y="190" width="8" height="4" rx="2" fill="#555"/>
  <line x1="675" y1="435" x2="683" y2="197" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <rect x="679" y="193" width="8" height="4" rx="2" fill="#555"/>

  <!-- Coupling zones right cluster -->
  <ellipse cx="510" cy="320" rx="44" ry="110" fill="#f0880020" stroke="#f08800" stroke-width="0.8" stroke-dasharray="5 4"/>
  <ellipse cx="543" cy="315" rx="44" ry="108" fill="#f0880018" stroke="#f08800" stroke-width="0.8" stroke-dasharray="5 4"/>
  <ellipse cx="576" cy="314" rx="44" ry="108" fill="#f0880018" stroke="#f08800" stroke-width="0.8" stroke-dasharray="5 4"/>
  <ellipse cx="609" cy="314" rx="44" ry="108" fill="#f0880018" stroke="#f08800" stroke-width="0.8" stroke-dasharray="5 4"/>
  <ellipse cx="642" cy="315" rx="44" ry="108" fill="#f0880018" stroke="#f08800" stroke-width="0.8" stroke-dasharray="5 4"/>
  <ellipse cx="675" cy="318" rx="44" ry="110" fill="#f0880020" stroke="#f08800" stroke-width="0.8" stroke-dasharray="5 4"/>

  <!-- Spacing callout between two antennas -->
  <line x1="130" y1="380" x2="163" y2="380" stroke="#ff6060" stroke-width="1.5"/>
  <line x1="130" y1="374" x2="130" y2="386" stroke="#ff6060" stroke-width="1.5"/>
  <line x1="163" y1="374" x2="163" y2="386" stroke="#ff6060" stroke-width="1.5"/>
  <text x="146" y="372" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#ff6060" font-weight="600">~3cm</text>

  <!-- Label: coupling zone -->
  <text x="210" y="160" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#f0aa40" font-weight="500">mutual coupling zone</text>
  <text x="210" y="175" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#f0aa4088">(heavily overlapping)</text>

  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="600">Dense wardriving node cluster</text>
  <text x="400" y="75" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#999" font-weight="400">Antennas packed at ~3cm — coupling zones overlap across all adjacent elements</text>

  <!-- Footer note -->
  <text x="400" y="560" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#666">Coupling power follows inverse square law — 2× distance = 4× less interference</text>
</svg>
