  <circle cx="190" cy="480" r="3" fill="#c0c0c4"/>
  <circle cx="204" cy="480" r="3" fill="#c0c0c4"/>
  <circle cx="218" cy="480" r="3" fill="#c0c0c4"/>
  <circle cx="232" cy="480" r="3" fill="#c0c0c4"/>
  <circle cx="246" cy="480" r="3" fill="#c0c0c4"/>
  <circle cx="260" cy="480" r="3" fill="#c0c0c4"/>
  <circle cx="274" cy="480" r="3" fill="#c0c0c4"/>
